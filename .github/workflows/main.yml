name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      # Runs anmol098/waka-readme-stats from source instead of `uses:`. The
      # action only sends WakaTime auth as `?api_key=`, which WakaTime now
      # rejects for stats (403 "API Keys are only for plugins"). Running the
      # source also makes the SHA pin real: the action's action.yml pulls the
      # floating `waka-readme-stats:master` Docker image.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: anmol098/waka-readme-stats
          ref: 4db28e08bfd8bac570125799fe1cfdcb23a8c871 # master @ 2026-10-10
          path: waka-readme-stats
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: waka-readme-stats/requirements.txt
      - run: pip install -r waka-readme-stats/requirements.txt
      - name: Update README
        working-directory: waka-readme-stats/sources
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/waka_readme.py"
        env:
          # Personal OAuth token (waka_tok_...), sent as a Bearer header.
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
          INPUT_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Volume metrics — deliberately off. Lines written, commits by hour and
          # commits by weekday measure keystrokes, not impact.
          INPUT_SHOW_LINES_OF_CODE: false
          INPUT_SHOW_COMMIT: false
          INPUT_SHOW_DAYS_OF_WEEK: false
          INPUT_SHOW_LOC_CHART: false
          INPUT_SHOW_PROFILE_VIEWS: false
          INPUT_SHOW_PROJECTS: false
          # Weekly AI breakdown — off. Its line-attribution telemetry reports all
          # zeros, so the derived "insights" contradict each other ("Mostly
          # Hands-On" and "High AI Trust" from the same null data). It also
          # published a weekly cost estimate. The all-time badge below is a real
          # measurement and stays.
          INPUT_SHOW_AI_CODING: false
          # Composition metrics — kept. These say what the work actually is.
          INPUT_SHOW_AI_CODE_TIME: true
          INPUT_SHOW_LANGUAGE: true
          INPUT_SHOW_LANGUAGE_PER_REPO: true
          INPUT_SHOW_EDITORS: true
          INPUT_SHOW_OS: true
          INPUT_SHOW_SHORT_INFO: true
          INPUT_UPDATED_DATE_FORMAT: "%m/%d/%Y %H:%M:%S"
