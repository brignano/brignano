name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Volume metrics — deliberately off. Lines written, commits by hour and
          # commits by weekday measure keystrokes, not impact.
          SHOW_LINES_OF_CODE: false
          SHOW_COMMIT: false
          SHOW_DAYS_OF_WEEK: false
          SHOW_LOC_CHART: false
          SHOW_PROFILE_VIEWS: false
          SHOW_PROJECTS: false
          # Weekly AI breakdown — off. Its line-attribution telemetry reports all
          # zeros, so the derived "insights" contradict each other ("Mostly
          # Hands-On" and "High AI Trust" from the same null data). It also
          # published a weekly cost estimate. The all-time badge below is a real
          # measurement and stays.
          SHOW_AI_CODING: false
          # Composition metrics — kept. These say what the work actually is.
          SHOW_AI_CODE_TIME: true
          SHOW_LANGUAGE: true
          SHOW_LANGUAGE_PER_REPO: true
          SHOW_EDITORS: true
          SHOW_OS: true
          SHOW_SHORT_INFO: true
          UPDATED_DATE_FORMAT: "%m/%d/%Y %H:%M:%S"
